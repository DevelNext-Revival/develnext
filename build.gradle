import org.gradle.internal.os.OperatingSystem;

def javaVersion = '1.8';

// Selects which Java/JavaFX runtime this build targets: '8' (default, unchanged) bundles a
// Java 8 JRE with JavaFX built in, same as always. '11' (-PjavaTarget=11) instead depends on
// OpenJFX 11 explicitly where needed (JavaFX isn't JDK-bundled from Java 9 onward) and swaps
// in Java-11-compatible artifact versions (e.g. RichTextFX) -- see develnext/build.gradle for
// the packaging side, and jphp-gui-tabs-ext/build.gradle for why some modules also need a
// forked, newer javac just to read those artifacts' class files (Java 8's javac tops out at
// class file version 52; OpenJFX 11/RichTextFX 0.11 are 54/55).
def javaTarget = project.hasProperty('javaTarget') ? project.javaTarget : '8'
def modernJdkHome = System.getenv('JDK11_HOME') ?: '/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home'

buildscript {
    ext {
        projectGroup = "org.develnext"
        projectVersion = '0.9.3' + (Boolean.getBoolean("release") ? "" : "-SNAPSHOT");
        jphpVersion = "0.9.3-SNAPSHOT"
        wizardVersion = "1.0.0-SNAPSHOT";
    }
}

task wrapper(type: Wrapper) {
    gradleVersion = 2.12;
}


allprojects {
    apply plugin: 'idea'
    apply plugin: 'java'
    apply plugin: 'maven'

    project.group = 'org.develnext'
    project.version = projectVersion
    project.ext.javaTarget = javaTarget

    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion

    repositories {
        mavenLocal()
        mavenCentral()
    }

    // Only matters for -PjavaTarget=11 builds needing to read a dependency's newer class
    // files (see the javaTarget comment above); the default javaTarget=8 build is completely
    // unaffected; still emits Java 8 bytecode either way via sourceCompatibility above.
    //
    // jphp-gui-tabs-ext's main sourceSet is exempt: it always needs to compile against FX8's
    // bundled com.sun.javafx.scene.control.skin.TabPaneSkin for DnDTabPaneSkin.java, which
    // doesn't exist under OpenJFX 11 at all, regardless of the overall build's javaTarget --
    // see jphp-gui-tabs-ext/build.gradle's separate fx9 source set for its FX9+ counterpart.
    if (javaTarget == '11' && project.name != 'jphp-gui-tabs-ext') {
        def modernJavac = file("$modernJdkHome/bin/javac")

        if (modernJavac.file) {
            tasks.withType(JavaCompile) {
                options.fork = true
                options.forkOptions.executable = modernJavac.path

                // Forking to an external javac executable (rather than an in-process/daemon
                // compiler) makes Gradle 2.10 silently drop sourceCompatibility/targetCompatibility
                // instead of translating them to -source/-target -- the forked javac then falls
                // back to ITS OWN default (e.g. class file version 65/Java 21 for a JDK 21 javac),
                // regardless of this project's declared 1.8 target. Confirmed by inspecting actual
                // compiled .class bytes before this fix (developnext-designer, develnext-launcher
                // were emitting version 65 despite sourceCompatibility=1.8 above). Read via doFirst,
                // not at closure-registration time, so per-task overrides (e.g. jphp-gui-tabs-ext's
                // compileFx9Java, which sets sourceCompatibility='9' later in ITS OWN build.gradle)
                // are already applied by the time this reads them.
                doFirst {
                    options.compilerArgs.addAll(['-source', sourceCompatibility, '-target', targetCompatibility])
                }
            }
        }
    }

    task sourcesJar(type: Jar, dependsOn: 'classes') {
        classifier = 'sources'
        from sourceSets.main.allSource
    }

    configurations {
        provided
    }

    sourceSets {
        main { compileClasspath += configurations.provided }
    }

    // JavaFX is bundled inside the JDK on Java 8 (the default target above), so no project
    // in this build has ever needed to declare it as a dependency -- javafx.* just resolves
    // via the compiler's own bundled classes. From Java 9 onward it's a separate artifact, so
    // -PjavaTarget=11 needs it added explicitly, uniformly across every project, since almost
    // all of them reference javafx.* directly. Provided-only: never bundled at runtime, since
    // the actual JavaFX in use is whatever the jre11 runtime bundle supplies at packaging time.
    // (jphp-gui-tabs-ext's main sourceSet is exempt for the same reason as above.)
    if (javaTarget == '11' && project.name != 'jphp-gui-tabs-ext') {
        dependencies {
            ['base', 'graphics', 'controls', 'fxml', 'media', 'swing', 'web'].each { module ->
                provided "org.openjfx:javafx-$module:11.0.2:mac"
            }
        }
    }
}

subprojects {
    def dirName = file(it.name).name;
    def bundleDirRoot = "${projectDir}/../../develnext/misc/library/bundles/";
    def bundleDir = "${bundleDirRoot}/${dirName}/";
    def pkgFile = file("$projectDir/package.php.yml")

    if (pkgFile.exists()) {
        task publish(type: Exec) {
            if (OperatingSystem.current().isWindows()) {
                commandLine 'cmd', '/c', 'jppm', 'publish', '-yes'
            } else {
                commandLine 'jppm', 'publish', '-yes'
            }

            workingDir = projectDir
        }

        task hubPublish(type: Exec, dependsOn: 'docBuild') {
            doFirst {
                if (!file(rootDir.path + "/package.hub.yml").isFile()) {
                    throw new GradleException("'package.hub.yml' is not found, please run 'jppm hub:login' in root dir before 'hubPublish'!")
                }

                copy {
                    from rootDir.path + "/package.hub.yml"
                    into projectDir.path
                }
            }

            if (OperatingSystem.current().isWindows()) {
                commandLine 'cmd', '/c', 'jppm', 'hub:publish', '-yes', '-f'
            } else {
                commandLine 'jppm', 'hub:publish', '-yes', '-f'
            }

            workingDir = projectDir
        }

        task docBuild(type: Exec) {
            if (OperatingSystem.current().isWindows()) {
                commandLine 'cmd', '/c', 'jppm', 'doc:build', '-yes'
            } else {
                commandLine 'jppm', 'doc:build', '-yes'
            }

            workingDir = projectDir
        }
    }

    if (it.name.startsWith("bundles/") || it.name.endsWith("-bundle")) {
        println "-> Detecting bundle '$it.name' ...";

        def resFile = file("$projectDir/.resource")

        if (!resFile.exists()) {
            resFile = file("$projectDir/src/.resource")
        }

        if (resFile.exists()) {
            clean {
                delete bundleDir
            }

            def pr = it;

            jar {
                doLast {
                    copy {
                        from jar.archivePath
                        from(pr.configurations.runtime) {
                            exclude '**/jphp-runtime-*.jar'
                        }

                        into bundleDir
                    }

                    copy {
                        from resFile
                        into "$bundleDir/.."
                        rename ".resource", "${dirName}.resource"
                    }

                    fileTree(bundleDir).visit { FileVisitDetails el ->
                        def name = el.getName()

                        if (name.endsWith(".jar")) {
                            name = name.replaceAll(/(-[0-9]+|\.[0-9]+|-SNAPSHOT)/, "");

                            if (!name.equals(el.getName())) {
                                println "Rename '" + el.file.parent + "/" + name + "' file"

                                def file = file(el.file.parent + "/" + name)

                                if (file.exists()) {
                                    file.delete()
                                }

                                if (!el.file.renameTo(file)) {
                                    el.file.delete()
                                }
                            }
                        }
                    }
                }
            }
        } else {
            println "WARNING, Bundle '$it.name' doesn't have '$projectDir/.resource' file!";
        }
    }

    if (it.name.startsWith("stubs/")) {
        sourceSets {
            main {
                resources.srcDirs = ['src']
            }
        }
    }
}

project(':jphp-desktop-hotkey-ext') {
    dependencies {
        compile "org.develnext.jphp:jphp-runtime:$jphpVersion"
        compile fileTree(dir: 'lib', include: ['*.jar'])
    }
}

project(':dn-app-framework') {
    dependencies {
        compile "org.develnext.jphp:jphp-core:$jphpVersion"
        compile "org.develnext.jphp:jphp-gui-ext:$jphpVersion"
    }
}

project(':develnext') {
    apply plugin: 'application'

    dependencies {
        compile "org.develnext.jphp:jphp-core:$jphpVersion"
        compile "org.develnext.jphp:jphp-gui-ext:$jphpVersion"
        compile "org.develnext.jphp:jphp-gui-desktop-ext:$jphpVersion"
        compile "org.develnext.jphp:jphp-gui-systemtray-ext:$jphpVersion"
        compile "org.develnext.jphp:jphp-parser-ext:$jphpVersion"

        compile project(':jphp-gui-tabs-ext')

        compile project(':develnext-launcher')
        compile project(':develnext-designer')
        compile project(':jphp-gui-richtext-ext')
        compile project(':dn-app-framework')
        compile project(':develnext-doc')

        // platforms
        file("$rootDir.path/platforms").listFiles().each { file ->
            if (file.directory && file.name.startsWith("develnext-") && file.name.endsWith("-platform")) {
                compile project(":platforms/$file.name")
            }
        }

        // bundles
        file("$rootDir.path/bundles").listFiles().each { file ->
            if (file.directory && file.name.startsWith("dn-") && file.name.endsWith("-bundle")) {
                provided project(":bundles/$file.name")
            }
        }

        compile "org.develnext.jphp:jphp-xml-ext:$jphpVersion"
        compile "org.develnext.jphp:jphp-zip-ext:$jphpVersion"
        compile "org.develnext.jphp:jphp-json-ext:$jphpVersion"
        compile "org.develnext.jphp:jphp-yaml-ext:$jphpVersion"
        compile "org.develnext.jphp:jphp-zend-ext:$jphpVersion"
        compile "org.develnext.jphp:jphp-sql-ext:$jphpVersion"
        compile "org.develnext.jphp:jphp-debugger:$jphpVersion"

        compile "org.develnext.framework:modules/wizard-localization:$wizardVersion"

        //compile fileTree(dir: 'libs', include: '*.jar')
    }
}

